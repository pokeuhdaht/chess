name: C++ CMake CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to manually trigger the workflow from the Actions tab

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    # Step 1: Check out the source code from the repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Set up a modern CMake and Ninja build environment
    - name: Setup CMake & Ninja
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: 'latest'

    # Step 3: Configure the CMake build directory
    - name: Configure CMake
      run: cmake -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=Release

    # Step 4: Compile the executable
    - name: Build Project
      run: cmake --build ${{ github.workspace }}/build --config Release

    # Step 5: Execute automated unit tests (if configured via CTest)
    - name: Run Tests
      working-directory: ${{ github.workspace }}/build
      run: ctest -C Release --output-on-failure
