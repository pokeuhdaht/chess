name: C++ CI (Direct Compiler)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Compile the C++ program directly using g++
    - name: Compile C++ program
      run: g++ -std=c++20 main.cpp -o my_cli_app

    # 3. Optional: Run the compiled application as a basic test
    - name: Run application
      run: |
        echo -e "exit" | ./my_cli_app
        
    - name: Timeout
      run: cancel-timeout-minutes 1
